<mo-combobox>
  <div data-combobox>
    <input role="combobox" aria-expanded="false" aria-controls="cb-timezones" aria-autocomplete="list" placeholder="Select a timezone..." autocomplete="off" aria-label="Timezone" />
    <button type="button" class="icon ghost" data-combobox-toggle aria-label="Toggle options">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
    </button>
  </div>
  <ul popover id="cb-timezones" role="listbox" aria-label="Timezones">
    <li role="group" aria-labelledby="cb-tz-americas">
      <div data-label id="cb-tz-americas">Americas</div>
      <button type="button" role="option">(GMT-5) New York</button>
      <button type="button" role="option">(GMT-8) Los Angeles</button>
      <button type="button" role="option">(GMT-6) Chicago</button>
      <button type="button" role="option">(GMT-5) Toronto</button>
      <button type="button" role="option">(GMT-3) S&#227;o Paulo</button>
    </li>
    <hr />
    <li role="group" aria-labelledby="cb-tz-europe">
      <div data-label id="cb-tz-europe">Europe</div>
      <button type="button" role="option">(GMT+0) London</button>
      <button type="button" role="option">(GMT+1) Paris</button>
      <button type="button" role="option">(GMT+1) Berlin</button>
      <button type="button" role="option">(GMT+1) Madrid</button>
      <button type="button" role="option">(GMT+1) Amsterdam</button>
    </li>
    <hr />
    <li role="group" aria-labelledby="cb-tz-apac">
      <div data-label id="cb-tz-apac">Asia/Pacific</div>
      <button type="button" role="option">(GMT+9) Tokyo</button>
      <button type="button" role="option">(GMT+8) Shanghai</button>
      <button type="button" role="option">(GMT+8) Singapore</button>
      <button type="button" role="option">(GMT+11) Sydney</button>
      <button type="button" role="option">(GMT+9) Seoul</button>
    </li>
    <li data-combobox-empty hidden>No timezones found.</li>
  </ul>
</mo-combobox>
