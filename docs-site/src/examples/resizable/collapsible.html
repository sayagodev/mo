<mo-resizable style="height: 16rem; border: 1px solid var(--border); border-radius: var(--radius-large); overflow: hidden;">
  <div data-resizable-panel data-collapsible data-min="0" style="padding: var(--space-4); background: var(--muted);">
    <strong>Collapsible</strong>
    <p class="text-light" style="font-size: var(--text-7);">Drag the handle to collapse. Double-click the divider to toggle.</p>
  </div>
  <div data-resizable-handle data-with-grip></div>
  <div data-resizable-panel style="padding: var(--space-4);">
    <strong>Main content</strong>
    <p class="text-light" style="font-size: var(--text-7);">This panel fills the space when the sidebar is collapsed.</p>
  </div>
</mo-resizable>
