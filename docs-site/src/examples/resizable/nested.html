<mo-resizable style="height: 18rem; border: 1px solid var(--border); border-radius: var(--radius-large); overflow: hidden;">
  <div data-resizable-panel style="padding: var(--space-4); display:flex; align-items:center; justify-content:center; background: var(--card);">
    <strong>Left 50%</strong>
  </div>
  <div data-resizable-handle></div>
  <div data-resizable-panel style="padding:0; overflow:hidden;">
    <mo-resizable data-orientation="vertical" style="height:100%; border:none;">
      <div data-resizable-panel style="padding: var(--space-4); display:flex; align-items:center; justify-content:center; background: var(--muted);">
        <strong>Top 25%</strong>
      </div>
      <div data-resizable-handle data-with-grip></div>
      <div data-resizable-panel style="padding: var(--space-4); display:flex; align-items:center; justify-content:center; background: var(--card);">
        <strong>Bottom 25%</strong>
      </div>
    </mo-resizable>
  </div>
</mo-resizable>
<small class="text-light" style="display:block; text-align:center; margin-block-start: var(--space-2);">Mitad y una mitad partida otra vez — como en shadcn</small>
