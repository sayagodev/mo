  </div>

  <div data-resizable-panel>
    <div style="display: flex; height: 100%; align-items: center; justify-content: center">Two</div>
  </div>

  <div data-resizable-panel data-min="20">
    <div style="display: flex; height: 100%; align-items: center; justify-content: center">Three</div>
  </div>
