<mo-resizable style="height: 14rem; border: 1px solid var(--border); border-radius: var(--radius-large); overflow: hidden;">
  <div data-resizable-panel style="padding: var(--space-4); background: var(--card);">
    <strong>Panel 1</strong>
    <p class="text-light" style="font-size: var(--text-7);">33%</p>
  </div>
  <div data-resizable-handle></div>
  <div data-resizable-panel style="padding: var(--space-4); background: var(--muted);">
    <strong>Panel 2</strong>
    <p class="text-light" style="font-size: var(--text-7);">33%</p>
  </div>
  <div data-resizable-handle></div>
  <div data-resizable-panel style="padding: var(--space-4); background: var(--card);">
    <strong>Panel 3</strong>
    <p class="text-light" style="font-size: var(--text-7);">33%</p>
  </div>
</mo-resizable>
