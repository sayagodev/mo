<button type="button" class="outline" command="show-modal" commandfor="dlg-share">Share</button>

<dialog id="dlg-share">
  <form method="dialog">
    <header>
      <h3>Share link</h3>
      <p>Anyone who has this link will be able to view this.</p>
    </header>
    <div>
      <input value="https://mo-ui.dev/docs/installation" readonly aria-label="Link" />
    </div>
    <footer data-align="start">
      <button type="button" command="close" commandfor="dlg-share">Close</button>
    </footer>
  </form>
</dialog>
