<mo-menubar>
  <button type="button" role="menuitem" popovertarget="mb-check-view">View</button>
  <menu popover id="mb-check-view">
    <button role="menuitemcheckbox" type="button" aria-checked="false">
      Always Show Bookmarks Bar
    </button>
    <button role="menuitemcheckbox" type="button" aria-checked="true">
      Always Show Full URLs
    </button>
    <hr />
    <button role="menuitem" type="button" data-inset>
      Reload
      <span data-shortcut>⌘R</span>
    </button>
    <button role="menuitem" type="button" disabled data-inset>
      Force Reload
      <span data-shortcut>⇧⌘R</span>
    </button>
  </menu>

  <button type="button" role="menuitem" popovertarget="mb-check-format">Format</button>
  <menu popover id="mb-check-format">
    <button role="menuitemcheckbox" type="button" aria-checked="true">
      Strikethrough
    </button>
    <button role="menuitemcheckbox" type="button" aria-checked="false">
      Code
    </button>
    <button role="menuitemcheckbox" type="button" aria-checked="false">
      Superscript
    </button>
  </menu>
</mo-menubar>
