<mo-menubar>
  <button type="button" role="menuitem" popovertarget="mb-radio-profiles">Profiles</button>
  <menu popover id="mb-radio-profiles">
    <button role="menuitemradio" type="button" aria-checked="false">Andy</button>
    <button role="menuitemradio" type="button" aria-checked="true">Benoit</button>
    <button role="menuitemradio" type="button" aria-checked="false">Luis</button>
    <hr />
    <button role="menuitem" type="button" data-inset>Edit…</button>
    <button role="menuitem" type="button" data-inset>Add Profile…</button>
  </menu>

  <button type="button" role="menuitem" popovertarget="mb-radio-theme">Theme</button>
  <menu popover id="mb-radio-theme">
    <button role="menuitemradio" type="button" aria-checked="false">Light</button>
    <button role="menuitemradio" type="button" aria-checked="false">Dark</button>
    <button role="menuitemradio" type="button" aria-checked="true">System</button>
  </menu>
</mo-menubar>
