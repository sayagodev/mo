<mo-tabs>
  <div role="tablist" data-variant="line">
    <button role="tab">Overview</button>
    <button role="tab">Analytics</button>
    <button role="tab">Reports</button>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Overview panel. data-variant="line" swaps the pill for a 2px underline.
    </p>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Analytics panel. Arrow keys still move between tabs.
    </p>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Reports panel.
    </p>
  </div>
</mo-tabs>
