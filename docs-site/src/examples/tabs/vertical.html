<mo-tabs data-orientation="vertical">
  <div role="tablist">
    <button role="tab">Account</button>
    <button role="tab">Password</button>
    <button role="tab">Notifications</button>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Make changes to your account here. ArrowUp and ArrowDown move between tabs.
    </p>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Change your password here. Panels toggle through the hidden attribute.
    </p>
  </div>
  <div role="tabpanel">
    <p class="text-light">
      Configure how you get notified.
    </p>
  </div>
</mo-tabs>
