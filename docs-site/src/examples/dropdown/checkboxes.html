  <menu popover id="dd-check">

    <button role="menuitemcheckbox" type="button" aria-checked="true">
      Active

      Paused

    <button role="menuitemcheckbox" type="button" aria-checked="false">
      Archived
    </button>
  </menu>
</mo-dropdown>
