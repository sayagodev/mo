<mo-dropdown>
  <button type="button" popovertarget="dd-demo" class="outline">Open</button>
  <menu popover id="dd-demo">
    <div data-label>My Account</div>
    <button role="menuitem" type="button">
      Billing
      <span data-shortcut>⌘B</span>
    </button>
    <button role="menuitem" type="button" disabled>
      Credits
      <span data-shortcut>⌘C</span>
    </button>
    <hr />
    <button role="menuitem" type="button" popovertarget="dd-demo-sub">
      Invite users
    </button>
    <menu popover id="dd-demo-sub">
      <button role="menuitem" type="button">Email</button>
      <button role="menuitem" type="button">Message</button>
      <hr />
      <button role="menuitem" type="button">More…</button>
    </menu>
    <hr />
    <button role="menuitem" type="button">Keyboard shortcuts</button>
    <button role="menuitem" type="button">API</button>
    <hr />
    <button role="menuitem" type="button">Team</button>
    <button role="menuitem" type="button">New team</button>
    <hr />
    <button role="menuitem" type="button" data-variant="danger">
      Log out
      <span data-shortcut>⇧⌘Q</span>
    </button>
  </menu>
</mo-dropdown>
