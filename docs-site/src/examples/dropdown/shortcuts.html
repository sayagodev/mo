<mo-dropdown>
  <button type="button" popovertarget="dd-shortcuts" class="outline">Open</button>
  <menu popover id="dd-shortcuts">
    <div data-label>My Account</div>
    <button role="menuitem" type="button">
      Profile
      <span data-shortcut>⇧⌘P</span>
    </button>
    <button role="menuitem" type="button">
      Billing
      <span data-shortcut>⌘B</span>
    </button>
    <button role="menuitem" type="button">
      Settings
      <span data-shortcut>⌘S</span>
    </button>
    <hr />
    <button role="menuitem" type="button">
      Log out
      <span data-shortcut>⇧⌘Q</span>
    </button>
  </menu>
</mo-dropdown>
