<mo-dropdown>
  <button type="button" popovertarget="dd-complex" class="outline">Complex Menu</button>
  <menu popover id="dd-complex">
    <div data-label>File</div>
    <button role="menuitem" type="button">
      New File
      <span data-shortcut>⌘N</span>
    </button>
    <button role="menuitem" type="button">
      New Folder
      <span data-shortcut>⇧⌘N</span>
    </button>
    <hr />
    <button role="menuitem" type="button" popovertarget="dd-complex-sub">
      Open Recent
    </button>
    <menu popover id="dd-complex-sub">
      <div data-label>Recent Projects</div>
      <button role="menuitem" type="button">Project Alpha</button>
      <button role="menuitem" type="button">Project Beta</button>
      <hr />
      <button role="menuitem" type="button" popovertarget="dd-complex-sub2">More Projects</button>
      <menu popover id="dd-complex-sub2">
        <button role="menuitem" type="button">Project Gamma</button>
        <button role="menuitem" type="button">Project Delta</button>
      </menu>
      <hr />
      <button role="menuitem" type="button">Browse…</button>
    </menu>
    <hr />
    <div data-label>View</div>
    <button role="menuitemcheckbox" type="button" aria-checked="true">
      Show Sidebar
    </button>
    <button role="menuitemcheckbox" type="button" aria-checked="false">
      Show Toolbar
    </button>
    <hr />
    <button role="menuitemradio" type="button" aria-checked="true">Light Theme</button>
    <button role="menuitemradio" type="button" aria-checked="false">Dark Theme</button>
  </menu>
</mo-dropdown>
