<mo-dropdown>
  <button type="button" popovertarget="dd-avatar" class="ghost icon" aria-label="Open account menu">
    <figure data-variant="avatar">LR</figure>
  </button>
  <menu popover id="dd-avatar">
    <button role="menuitem" type="button">
      Account
      <span data-shortcut>⇧⌘A</span>
    </button>
    <button role="menuitem" type="button">
      Billing
      <span data-shortcut>⌘B</span>
    </button>
    <hr />
    <button role="menuitem" type="button" data-variant="danger">
      Log out
      <span data-shortcut>⇧⌘Q</span>
    </button>
  </menu>
</mo-dropdown>
