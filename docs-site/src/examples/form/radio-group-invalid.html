<fieldset aria-invalid="true">
  <legend>Notification Preferences</legend>
  <p class="text-light">Choose how you want to receive notifications.</p>
  <div data-field class="mt-2">
    <div class="vstack gap-2">
      <label><input type="radio" name="rg-notif" value="email" checked aria-invalid="true" /> Email only</label>
      <label><input type="radio" name="rg-notif" value="sms" aria-invalid="true" /> SMS only</label>
      <label><input type="radio" name="rg-notif" value="both" aria-invalid="true" /> Both Email &amp; SMS</label>
    </div>
    <small class="error">Select a notification preference to continue.</small>
  </div>
</fieldset>
