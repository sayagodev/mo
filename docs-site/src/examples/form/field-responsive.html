<form>
  <fieldset>
    <legend>Profile</legend>
    <p class="text-light">Fill in your profile information.</p>
    <div data-field>
      <label for="ex-profile-name">Name</label>
      <small data-hint>Provide your full name for identification.</small>
      <input id="ex-profile-name" required placeholder="Evil Rabbit" />
    </div>
    <div class="hstack">
      <button type="submit">Submit</button>
      <button type="button" class="outline">Cancel</button>
    </div>
  </fieldset>
</form>
