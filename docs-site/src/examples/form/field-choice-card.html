<div class="vstack gap-4">
  <span class="vstack gap-1">
    <strong>Compute Environment</strong>
    <span class="text-light">Select the compute environment for your cluster.</span>
  </span>
  <label class="flex items-center justify-between gap-4">
    <span class="vstack gap-1">
      <strong>Kubernetes</strong>
      <span class="text-light">Run GPU workloads on a K8s cluster.</span>
    </span>
    <input type="radio" name="ex-compute" value="kubernetes" checked />
  </label>
  <label class="flex items-center justify-between gap-4">
    <span class="vstack gap-1">
      <strong>Virtual Machine</strong>
      <span class="text-light">Access a cluster to run GPU workloads.</span>
    </span>
    <input type="radio" name="ex-compute" value="vm" />
  </label>
</div>
