<div class="vstack gap-6">
  <label class="flex items-center justify-between gap-4">
    <span class="vstack gap-1">
      <strong>Share across devices</strong>
      <span class="text-light">Focus is shared across devices, and turns off when you leave the app.</span>
    </span>
    <input type="checkbox" role="switch" id="sw-card-share" />
  </label>
  <label class="flex items-center justify-between gap-4">
    <span class="vstack gap-1">
      <strong>Enable notifications</strong>
      <span class="text-light">Receive notifications when focus mode is enabled or disabled.</span>
    </span>
    <input type="checkbox" role="switch" id="sw-card-notifications" checked />
  </label>
</div>
