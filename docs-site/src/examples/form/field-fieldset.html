<fieldset>
  <legend>Address Information</legend>
  <p class="text-light">We need your address to deliver your order.</p>
  <div data-field>
    <label for="ex-street">Street Address</label>
    <input id="ex-street" placeholder="123 Main St" />
  </div>
  <div class="row">
    <div class="col-6">
      <div data-field>
        <label for="ex-city">City</label>
        <input id="ex-city" placeholder="New York" />
      </div>
    </div>
    <div class="col-6">
      <div data-field>
        <label for="ex-zip">Postal Code</label>
        <input id="ex-zip" placeholder="90502" />
      </div>
    </div>
  </div>
</fieldset>
