<div data-field>
  <label for="ex-dept">Department</label>
  <mo-select data-placeholder="Choose department">
    <button type="button" popovertarget="ex-dept" data-select-trigger aria-label="Department"></button>
    <ul popover id="ex-dept" class="popover" role="listbox">
      <li><button type="button" role="option" value="engineering">Engineering</button></li>
      <li><button type="button" role="option" value="design">Design</button></li>
      <li><button type="button" role="option" value="marketing">Marketing</button></li>
      <li><button type="button" role="option" value="sales">Sales</button></li>
      <li><button type="button" role="option" value="support">Customer Support</button></li>
      <li><button type="button" role="option" value="hr">Human Resources</button></li>
      <li><button type="button" role="option" value="finance">Finance</button></li>
      <li><button type="button" role="option" value="operations">Operations</button></li>
    </ul>
  </mo-select>
  <small data-hint>Select your department or area of work.</small>
</div>
