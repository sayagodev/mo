<div class="vstack gap-4">
  <div data-field>
    <label for="ex-ig-default">Default</label>
    <input id="ex-ig-default" placeholder="Placeholder" />
  </div>
  <div data-field>
    <label for="ex-ig-disabled">Disabled</label>
    <input id="ex-ig-disabled" placeholder="This field is disabled" disabled />
  </div>
  <div data-field aria-invalid="true">
    <label for="ex-ig-invalid">Invalid</label>
    <input id="ex-ig-invalid" placeholder="This field is invalid" aria-invalid="true" />
    <small class="error">This field contains validation errors.</small>
  </div>
</div>
