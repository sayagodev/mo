<div class="vstack gap-4">
  <div class="flex items-start gap-2">
    <input type="radio" id="rd-desc-default" name="rg-desc" value="default" />
    <div class="vstack gap-1">
      <label for="rd-desc-default">Default</label>
      <small class="text-light">Standard spacing for most use cases.</small>
    </div>
  </div>
  <div class="flex items-start gap-2">
    <input type="radio" id="rd-desc-comfortable" name="rg-desc" value="comfortable" checked />
    <div class="vstack gap-1">
      <label for="rd-desc-comfortable">Comfortable</label>
      <small class="text-light">More space between elements.</small>
    </div>
  </div>
  <div class="flex items-start gap-2">
    <input type="radio" id="rd-desc-compact" name="rg-desc" value="compact" />
    <div class="vstack gap-1">
      <label for="rd-desc-compact">Compact</label>
      <small class="text-light">Minimal spacing for dense layouts.</small>
    </div>
  </div>
</div>
