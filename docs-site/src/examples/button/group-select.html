<div data-button-group role="group" aria-label="Amount">
  <div data-button-group>
    <select aria-label="Currency" style="font-family: var(--font-mono)">
      <option value="$">$</option>
      <option value="€">€</option>
      <option value="£">£</option>
    </select>
    <input placeholder="10.00" inputmode="decimal" pattern="[0-9]*" aria-label="Amount" />
  </div>
  <div data-button-group>
    <button type="button" class="outline icon" aria-label="Send">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
    </button>
  </div>
</div>
