<button type="button" class="outline" command="show-modal" commandfor="ex-sheet-left">Left</button>

<dialog closedby="any" id="ex-sheet-left" class="sheet" data-side="left">
  <form method="dialog">
    <button type="submit" value="cancel" class="icon ghost" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <header>
      <h3>Edit profile</h3>
      <p>Make changes to your profile here. Click save when you're done.</p>
    </header>
    <div>
      <div data-field>
        <label for="ex-sheet-left-name">Name</label>
        <input id="ex-sheet-left-name" value="Pedro Duarte" />
      </div>
      <div data-field>
        <label for="ex-sheet-left-username">Username</label>
        <input id="ex-sheet-left-username" value="@peduarte" />
      </div>
    </div>
    <footer>
      <button type="submit">Save changes</button>
      <button type="submit" class="ghost" value="cancel">Cancel</button>
    </footer>
  </form>
</dialog>
