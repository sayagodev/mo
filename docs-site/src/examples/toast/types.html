<div class="hstack gap-2">
  <button type="button" class="outline" data-toast="This is a neutral toast.">Default</button>
  <button type="button" class="outline" data-toast="Everything went well." data-toast-title="Success" data-toast-variant="success">Success</button>
  <button type="button" class="outline" data-toast="Heads up, here is some information." data-toast-title="Info" data-toast-variant="info">Info</button>
  <button type="button" class="outline" data-toast="Be careful with this action." data-toast-title="Warning" data-toast-variant="warning">Warning</button>
  <button type="button" class="outline" data-toast="Something went wrong." data-toast-title="Error" data-toast-variant="danger">Error</button>
</div>
