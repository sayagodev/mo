<button
  type="button"
  data-variant="secondary"
  onclick="mo.toast('Your changes were saved.', 'Saved', { variant: 'success' })"
>
  Success toast
</button>
<button
  type="button"
  class="outline"
  onclick="mo.toast('Could not reach the server. Retry?', 'Error', { variant: 'danger', placement: 'bottom-center' })"
>
  Error toast
</button>
<button type="button" class="ghost" onclick="mo.toast('Heads up — something happened.')">
  Plain toast
</button>
