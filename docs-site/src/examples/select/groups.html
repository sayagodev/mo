<mo-select data-placeholder="Select food">
  <button type="button" popovertarget="ex-sel-food" data-select-trigger aria-label="Food"></button>
  <ul popover id="ex-sel-food" class="popover" role="listbox" aria-label="Food groups">
    <li role="group">
      <div data-label>Fruits</div>
      <button type="button" role="option" value="apple">Apple</button>
      <button type="button" role="option" value="banana">Banana</button>
      <button type="button" role="option" value="blueberry">Blueberry</button>
    </li>
    <hr />
    <li role="group">
      <div data-label>Vegetables</div>
      <button type="button" role="option" value="carrot">Carrot</button>
      <button type="button" role="option" value="potato">Potato</button>
      <button type="button" role="option" value="tomato">Tomato</button>
    </li>
  </ul>
</mo-select>
