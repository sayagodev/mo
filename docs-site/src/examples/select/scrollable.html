<mo-select data-placeholder="Select timezone">
  <button type="button" popovertarget="ex-sel-tz" data-select-trigger aria-label="Timezone"></button>
  <ul popover id="ex-sel-tz" class="popover" role="listbox" aria-label="Timezones">
    <li><button type="button" role="option" value="gmt-11">GMT-11:00 Midway Island</button></li>
    <li><button type="button" role="option" value="gmt-10">GMT-10:00 Hawaii</button></li>
    <li><button type="button" role="option" value="gmt-8">GMT-08:00 Pacific Time</button></li>
    <li><button type="button" role="option" value="gmt-7">GMT-07:00 Mountain Time</button></li>
    <li><button type="button" role="option" value="gmt-6">GMT-06:00 Central Time</button></li>
    <li><button type="button" role="option" value="gmt-5">GMT-05:00 Eastern Time</button></li>
    <li><button type="button" role="option" value="gmt-3">GMT-03:00 Brasilia Time</button></li>
    <li><button type="button" role="option" value="gmt+0">GMT+00:00 UTC</button></li>
    <li><button type="button" role="option" value="gmt+1">GMT+01:00 Central European Time</button></li>
    <li><button type="button" role="option" value="gmt+2">GMT+02:00 Eastern European Time</button></li>
    <li><button type="button" role="option" value="gmt+3">GMT+03:00 Moscow Time</button></li>
    <li><button type="button" role="option" value="gmt+4">GMT+04:00 Gulf Standard Time</button></li>
    <li><button type="button" role="option" value="gmt+5:30">GMT+05:30 India Time</button></li>
    <li><button type="button" role="option" value="gmt+7">GMT+07:00 Indochina Time</button></li>
    <li><button type="button" role="option" value="gmt+8">GMT+08:00 China Standard Time</button></li>
    <li><button type="button" role="option" value="gmt+9">GMT+09:00 Japan Standard Time</button></li>
    <li><button type="button" role="option" value="gmt+10">GMT+10:00 Eastern Australia Time</button></li>
    <li><button type="button" role="option" value="gmt+12">GMT+12:00 New Zealand Time</button></li>
  </ul>
</mo-select>
