<mo-select data-placeholder="Select a fruit">
  <button type="button" popovertarget="ex-sel-disabled" data-select-trigger aria-label="Fruit"></button>
  <ul popover id="ex-sel-disabled" class="popover" role="listbox" aria-label="Fruits">
    <li><button type="button" role="option" value="apple">Apple</button></li>
    <li><button type="button" role="option" value="banana" disabled>Banana</button></li>
    <li><button type="button" role="option" value="blueberry">Blueberry</button></li>
    <li><button type="button" role="option" value="grapes">Grapes</button></li>
    <li><button type="button" role="option" value="pineapple">Pineapple</button></li>
  </ul>
</mo-select>
