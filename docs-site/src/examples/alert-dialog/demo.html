<button type="button" class="outline" command="show-modal" commandfor="ad-demo">Show Dialog</button>

<dialog id="ad-demo" role="alertdialog" aria-labelledby="ad-demo-title">
  <form method="dialog">
    <header>
      <h3 id="ad-demo-title">Are you absolutely sure?</h3>
      <p>This action cannot be undone. This will permanently delete your account from our servers.</p>
    </header>
    <footer>
      <button type="button" class="ghost" value="cancel" command="close" commandfor="ad-demo">Cancel</button>
      <button type="submit" value="continue">Continue</button>
    </footer>
  </form>
</dialog>
