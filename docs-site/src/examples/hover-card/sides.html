<div class="hstack flex-wrap">
  <mo-hovercard>
    <button type="button" class="outline">bottom</button>
    <div popover id="ex-hovercard-bottom">
      <strong>Hover Card</strong>
      <p>This hover card appears below the trigger — the default side.</p>
    </div>
  </mo-hovercard>
  <mo-hovercard>
    <button type="button" class="outline">top</button>
    <div popover id="ex-hovercard-top" data-side="top">
      <strong>Hover Card</strong>
      <p>This hover card appears above the trigger.</p>
    </div>
  </mo-hovercard>
  <mo-hovercard>
    <button type="button" class="outline">left</button>
    <div popover id="ex-hovercard-left" data-side="left">
      <strong>Hover Card</strong>
      <p>This appears to the left of the trigger.</p>
    </div>
  </mo-hovercard>
  <mo-hovercard>
    <button type="button" class="outline">right</button>
    <div popover id="ex-hovercard-right" data-side="right">
      <strong>Hover Card</strong>
      <p>This appears to the right of the trigger.</p>
    </div>
  </mo-hovercard>
</div>
