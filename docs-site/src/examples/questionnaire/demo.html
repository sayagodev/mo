<mo-questionnaire>
  <div data-questionnaire-progress></div>

  <form data-questionnaire-step>
    <h3>Account details</h3>
    <p>Tell us who will own this workspace.</p>
    <div data-field>
      <label for="q-name">Full name</label>
      <input id="q-name" name="name" required placeholder="Evil Rabbit" />
    </div>
    <div data-field>
      <label for="q-email">Email</label>
      <input id="q-email" name="email" type="email" required placeholder="you@example.com" />
      <small data-hint>Workspace invitations are sent from this address.</small>
    </div>
    <footer>
      <button type="button" class="ghost" data-questionnaire-back>Back</button>
      <button type="submit">Continue</button>
    </footer>
  </form>

  <form data-questionnaire-step hidden>
    <h3>Preferences</h3>
    <p>Choose how your workspace behaves out of the box.</p>
    <fieldset>
      <legend>Visibility</legend>
      <div class="vstack gap-2">
        <label><input type="radio" name="visibility" value="private" checked /> Private — invite only</label>
        <label><input type="radio" name="visibility" value="team" /> Team — anyone with the link</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Progress updates</legend>
      <p class="text-light">Select all that apply, or skip this question.</p>
      <div class="vstack gap-2">
        <label><input type="checkbox" name="signals" value="tool-calls" checked /> Tool call timeline</label>
        <label><input type="checkbox" name="signals" value="approvals" /> Approval checkpoints</label>
        <label><input type="checkbox" name="signals" value="handoffs" /> Sub-agent handoffs</label>
      </div>
    </fieldset>
    <footer>
      <button type="button" class="ghost" data-questionnaire-back>Back</button>
      <button type="submit">Save plan</button>
    </footer>
  </form>
</mo-questionnaire>
