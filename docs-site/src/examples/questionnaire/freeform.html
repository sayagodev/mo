<mo-questionnaire style="max-width: 28rem; margin-inline: auto;">
  <div data-questionnaire-progress></div>

  <form data-questionnaire-step data-required>
    <h3>What should the agent prototype next?</h3>
    <p>Choose a direction or write your own.</p>
    <div data-questionnaire-choices>
      <label data-questionnaire-choice>
        <input type="radio" name="prototype" value="delegation">
        <span data-indicator data-type="radio"></span>
        <span data-questionnaire-label>Delegation <small data-questionnaire-description>Show how work moves to a specialist.</small></span>
      </label>
      <label data-questionnaire-choice>
        <input type="radio" name="prototype" value="questions">
        <span data-indicator data-type="radio"></span>
        <span data-questionnaire-label>Question prompts <small data-questionnaire-description>Show choices while the interface waits.</small></span>
      </label>
      <label data-questionnaire-choice>
        <input type="radio" name="prototype" value="both">
        <span data-indicator data-type="radio"></span>
        <span data-questionnaire-label>Both together</span>
      </label>
    </div>
    <div data-questionnaire-input style="margin-block-start: var(--space-2);">
      <input name="prototype-custom" placeholder="Describe another feature…" aria-label="Another feature" />
    </div>
    <div data-questionnaire-error></div>
    <footer>
      <button type="button" class="ghost" data-questionnaire-back>Back</button>
      <button type="submit">Next</button>
    </footer>
  </form>

  <form data-questionnaire-step hidden>
    <h3>Anything else?</h3>
    <p>Leave a note for the reviewer (optional).</p>
    <div data-questionnaire-input>
      <textarea name="notes" rows="3" placeholder="Add context…"></textarea>
    </div>
    <footer>
      <button type="button" class="ghost" data-questionnaire-back>Back</button>
      <button type="button" class="outline" data-questionnaire-skip>Skip</button>
      <button type="submit">Submit</button>
    </footer>
  </form>
</mo-questionnaire>
