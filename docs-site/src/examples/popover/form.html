<button type="button" class="outline" popovertarget="ex-pop-form">Open popover</button>

<div popover id="ex-pop-form" class="popover" style="inline-size: 16rem">
  <div class="vstack gap-4">
    <div class="vstack gap-1">
      <div data-title>Dimensions</div>
      <p data-description>Set the dimensions for the layer.</p>
    </div>
    <label class="vstack gap-2" for="ex-pop-form-width">
      Width
      <input id="ex-pop-form-width" value="100%" />
    </label>
    <label class="vstack gap-2" for="ex-pop-form-height">
      Height
      <input id="ex-pop-form-height" value="25px" />
    </label>
    <button type="button" class="small">Update</button>
  </div>
</div>
