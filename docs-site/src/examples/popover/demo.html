<button type="button" class="outline" popovertarget="ex-popover">Open popover</button>

<div popover id="ex-popover" class="popover">
  <div class="vstack gap-4">
    <div class="vstack gap-1">
      <div data-title>Dimensions</div>
      <p data-description>Set the dimensions for the layer.</p>
    </div>
    <div class="vstack gap-2">
      <div class="row gap-2 items-center">
        <label class="col-4" for="ex-pop-width">Width</label>
        <input id="ex-pop-width" class="col-8" value="100%" />
      </div>
      <div class="row gap-2 items-center">
        <label class="col-4" for="ex-pop-max-width">Max. width</label>
        <input id="ex-pop-max-width" class="col-8" value="300px" />
      </div>
      <div class="row gap-2 items-center">
        <label class="col-4" for="ex-pop-height">Height</label>
        <input id="ex-pop-height" class="col-8" value="25px" />
      </div>
      <div class="row gap-2 items-center">
        <label class="col-4" for="ex-pop-max-height">Max. height</label>
        <input id="ex-pop-max-height" class="col-8" value="none" />
      </div>
    </div>
  </div>
</div>
