<div class="hstack">
  <button type="button" class="outline" popovertarget="ex-pop-start">Start</button>
  <button type="button" class="outline" popovertarget="ex-pop-center">Center</button>
  <button type="button" class="outline" popovertarget="ex-pop-end">End</button>
</div>

<!-- Alignment is manual by author: size/position each surface with your own
     CSS (e.g. anchor positioning or top/left overrides). -->
<div popover id="ex-pop-start" class="popover" data-align="start">Aligned to start</div>
<div popover id="ex-pop-center" class="popover" data-align="center">Aligned to center</div>
<div popover id="ex-pop-end" class="popover" data-align="end">Aligned to end</div>
