<div data-context-menu data-variant="outline">
  Right click here
  <menu popover id="ctx-shortcuts">
    <button role="menuitem" type="button">
      Back
      <span data-shortcut>⌘[</span>
    </button>
    <button role="menuitem" type="button" disabled>
      Forward
      <span data-shortcut>⌘]</span>
    </button>
    <button role="menuitem" type="button">
      Reload
      <span data-shortcut>⌘R</span>
    </button>
    <hr />
    <button role="menuitem" type="button">
      Save
      <span data-shortcut>⌘S</span>
    </button>
    <button role="menuitem" type="button">
      Save As…
      <span data-shortcut>⇧⌘S</span>
    </button>
  </menu>
</div>
