<div data-context-menu data-variant="outline">
  Right click here
  <menu popover id="ctx-submenu">
    <button role="menuitem" type="button">
      Copy
      <span data-shortcut>⌘C</span>
    </button>
    <button role="menuitem" type="button">
      Cut
      <span data-shortcut>⌘X</span>
    </button>
    <hr />
    <button role="menuitem" type="button" popovertarget="ctx-submenu-more">More Tools</button>
    <menu popover id="ctx-submenu-more">
      <button role="menuitem" type="button">Save Page...</button>
      <button role="menuitem" type="button">Create Shortcut...</button>
      <button role="menuitem" type="button">Name Window...</button>
      <hr />
      <button role="menuitem" type="button">Developer Tools</button>
      <hr />
      <button role="menuitem" type="button" data-variant="danger">Delete</button>
    </menu>
  </menu>
</div>
