<div data-context-menu data-variant="outline">
  Right click here
  <menu popover id="ctx-groups">
    <div role="group">
      <div data-label>File</div>
      <button role="menuitem" type="button">New File <span data-shortcut>⌘N</span></button>
      <button role="menuitem" type="button">Open File <span data-shortcut>⌘O</span></button>
      <button role="menuitem" type="button">Save <span data-shortcut>⌘S</span></button>
    </div>
    <hr />
    <div role="group">
      <div data-label>Edit</div>
      <button role="menuitem" type="button">Undo <span data-shortcut>⌘Z</span></button>
      <button role="menuitem" type="button">Redo <span data-shortcut>⇧⌘Z</span></button>
    </div>
    <hr />
    <div role="group">
      <button role="menuitem" type="button">Cut <span data-shortcut>⌘X</span></button>
      <button role="menuitem" type="button">Copy <span data-shortcut>⌘C</span></button>
      <button role="menuitem" type="button">Paste <span data-shortcut>⌘V</span></button>
    </div>
    <hr />
    <div role="group">
      <button role="menuitem" type="button" data-variant="danger">Delete <span data-shortcut>⌫</span></button>
    </div>
  </menu>
</div>
