<mo-dropdown>
  <button type="button" popovertarget="kbd-menu" class="outline">Shortcuts</button>
  <menu popover id="kbd-menu">
    <button role="menuitem" type="button">
      Undo
      <span data-shortcut>⌘Z</span>
    </button>
    <button role="menuitem" type="button">
      Redo
      <span data-shortcut>⇧⌘Z</span>
    </button>
    <hr />
    <div data-label>View</div>
    <button role="menuitem" type="button">
      Zoom In
      <span data-shortcut>⌘+</span>
    </button>
  </menu>
</mo-dropdown>
