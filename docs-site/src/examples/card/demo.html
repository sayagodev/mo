<article class="card">
  <header>
    <h3>Login to your account</h3>
    <p>Enter your email below to login to your account</p>
    <div data-action>
      <button type="button" class="link">Sign Up</button>
    </div>
  </header>
  <form class="vstack gap-4">
    <div data-field>
      <label for="card-demo-email">Email</label>
      <input id="card-demo-email" type="email" placeholder="m@example.com" required />
    </div>
    <div data-field>
      <div class="flex items-center justify-between gap-2">
        <label for="card-demo-password">Password</label>
        <a href="#" class="unstyled">Forgot your password?</a>
      </div>
      <input id="card-demo-password" type="password" required />
    </div>
  </form>
  <footer class="mt-4">
    <div class="vstack w-100">
      <button type="submit">Login</button>
      <button type="button" class="outline">Login with Google</button>
    </div>
  </footer>
</article>
