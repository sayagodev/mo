<div class="vstack gap-3">
  <div>
    <small class="text-light" style="display:block; margin-block-end: var(--space-2);">Single field with visual separator (recommended)</small>
    <mo-otp length="6" data-separator="3"></mo-otp>
  </div>
  <div>
    <small class="text-light" style="display:block; margin-block-end: var(--space-2);">Two linked fields (auto-advances to next)</small>
    <div class="hstack gap-2">
      <mo-otp length="3"></mo-otp>
      <span aria-hidden="true" style="color: var(--muted-foreground);">—</span>
      <mo-otp length="3"></mo-otp>
    </div>
  </div>
</div>
<small class="text-light">Separator between groups — type across both fields.</small>
