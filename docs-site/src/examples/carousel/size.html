<mo-carousel>
  <section data-carousel aria-roledescription="carousel" aria-label="Slide sizes">
    <div data-carousel-track>
      <article class="card" data-carousel-slide>
        <header>
          <h3>Default</h3>
          <p>Slides are 100% wide unless sized.</p>
        </header>
      </article>
      <article class="card" data-carousel-slide data-size="sm">
        <header>
          <h3>data-size="sm"</h3>
          <p>An 80% basis — a peek of the next slide.</p>
        </header>
      </article>
      <article class="card" data-carousel-slide data-size="lg">
        <header>
          <h3>data-size="lg"</h3>
          <p>A 50% basis shows the next half.</p>
        </header>
      </article>
      <article class="card" data-carousel-slide data-size="sm">
        <header>
          <h3>Sized again</h3>
          <p>Bases can vary per slide.</p>
        </header>
      </article>
      <article class="card" data-carousel-slide>
        <header>
          <h3>Full width</h3>
          <p>Back to the 100% default.</p>
        </header>
      </article>
    </div>
    <div data-carousel-controls>
      <button type="button" data-carousel-previous class="icon outline" aria-label="Previous slide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
      </button>
      <div data-carousel-dots></div>
      <button type="button" data-carousel-next class="icon outline" aria-label="Next slide">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </button>
    </div>
  </section>
</mo-carousel>
