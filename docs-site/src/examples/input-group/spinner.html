<div class="vstack gap-4">
  <div data-input-group>
    <span data-addon>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
    </span>
    <input placeholder="Search..." aria-label="Search" />
    <span data-addon>
      <kbd>⌘K</kbd>
    </span>
  </div>
  <div data-input-group>
    <input placeholder="Send a message..." disabled aria-label="Message" />
    <span data-addon aria-hidden="true">
      <span aria-busy="true" data-spinner="small"></span>
    </span>
  </div>
  <div data-input-group>
    <textarea placeholder="Send a message..." disabled aria-label="Message"></textarea>
    <span data-addon data-align="block-end">
      <span class="flex items-center gap-2">
        <span aria-busy="true" data-spinner="small"></span>
        Validating…
      </span>
      <button type="button" class="icon" data-push aria-label="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></svg>
      </button>
    </span>
  </div>
</div>
