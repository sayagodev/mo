<div class="vstack gap-4">
  <div data-input-group>
    <input placeholder="Press ⌘K to focus…" aria-label="Command palette trigger" />
    <span data-addon><kbd>⌘K</kbd></span>
  </div>
  <div data-field>
    <label for="ig-kbd-hint">Shortcut hint in a field</label>
    <div data-input-group>
      <input id="ig-kbd-hint" placeholder="Filter issues…" />
      <span data-addon><kbd>⌘P</kbd></span>
    </div>
    <span data-hint>Press the shortcut from anywhere to open this filter.</span>
  </div>
</div>
