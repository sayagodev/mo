<div class="vstack gap-4">
  <div data-field>
    <label for="ig-basic-default">Default (no input group)</label>
    <input id="ig-basic-default" placeholder="Placeholder" />
  </div>
  <div data-field>
    <label for="ig-basic-group">Input group</label>
    <div data-input-group>
      <input id="ig-basic-group" placeholder="Placeholder" />
    </div>
    <span data-hint>This is a hint for the input group.</span>
  </div>
  <div data-field>
    <label for="ig-basic-disabled">Disabled</label>
    <div data-input-group>
      <input id="ig-basic-disabled" placeholder="This field is disabled" disabled />
    </div>
  </div>
  <div data-field aria-invalid="true">
    <label for="ig-basic-invalid">Invalid</label>
    <div data-input-group>
      <input id="ig-basic-invalid" placeholder="This field is invalid" aria-invalid="true" />
    </div>
    <small class="error">This field contains validation errors.</small>
  </div>
</div>
