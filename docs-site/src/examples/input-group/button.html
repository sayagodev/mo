<div class="vstack gap-4">
  <div data-input-group>
    <input placeholder="https://x.com/shadcn" value="https://x.com/shadcn" readonly aria-label="Profile URL" />
    <span data-addon>
      <button type="button" class="icon ghost" aria-label="Copy">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>
      </button>
    </span>
  </div>
  <div data-input-group>
    <span data-addon>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
      Your connection is not secure.
    </span>
    <input aria-label="Address" />
  </div>
  <div data-input-group>
    <input placeholder="Type to search..." aria-label="Search" />
    <span data-addon>
      <button type="button" class="ghost">Search</button>
    </span>
  </div>
  <div data-field aria-invalid="true">
    <label for="ig-button-invalid">Invalid turns addon hairlines destructive</label>
    <div data-input-group>
      <span data-addon>@</span>
      <input id="ig-button-invalid" value="not-an-email" aria-invalid="true" />
      <span data-addon>
        <button type="button" class="icon ghost" aria-label="Clear">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </span>
    </div>
    <small class="error">Enter a valid handle.</small>
  </div>
</div>
