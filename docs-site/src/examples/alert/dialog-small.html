<button type="button" class="outline" command="show-modal" commandfor="alert-dialog-small">Show Dialog</button>

<dialog id="alert-dialog-small" style="max-width:24rem;">
  <form method="dialog">
    <header style="align-items:center; text-align:center;">
      <h3>Allow accessory to connect?</h3>
      <p>Do you want to allow the USB accessory to connect to this device?</p>
    </header>
    <footer style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2);">
      <button type="button" class="ghost" value="cancel" command="close" commandfor="alert-dialog-small">Don't allow</button>
      <button type="submit" value="allow">Allow</button>
    </footer>
  </form>
</dialog>
