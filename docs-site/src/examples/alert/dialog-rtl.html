<div dir="rtl" style="display:flex; gap:var(--space-4);">
  <button type="button" class="outline" command="show-modal" commandfor="alert-dialog-rtl">إظهار الحوار</button>
  <button type="button" class="outline" command="show-modal" commandfor="alert-dialog-rtl-sm">إظهار الحوار (صغير)</button>
</div>

<dialog id="alert-dialog-rtl" dir="rtl">
  <form method="dialog">
    <header>
      <h3>هل أنت متأكد تمامًا؟</h3>
      <p>لا يمكن التراجع عن هذا الإجراء. سيؤدي هذا إلى حذف حسابك نهائيًا من خوادمنا.</p>
    </header>
    <footer>
      <button type="button" class="ghost" value="cancel" command="close" commandfor="alert-dialog-rtl">إلغاء</button>
      <button type="submit" value="continue">متابعة</button>
    </footer>
  </form>
</dialog>

<dialog id="alert-dialog-rtl-sm" dir="rtl" style="max-width:24rem;">
  <form method="dialog">
    <header style="align-items:center; text-align:center;">
      <div style="display:inline-flex; width:2.5rem; height:2.5rem; align-items:center; justify-content:center; background:var(--muted); border-radius:var(--radius-small); margin-bottom:var(--space-2);">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17" /></svg>
      </div>
      <h3>السماح للملحق بالاتصال؟</h3>
      <p>هل تريد السماح لملحق USB بالاتصال بهذا الجهاز؟</p>
    </header>
    <footer style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2);">
      <button type="button" class="ghost" value="cancel" command="close" commandfor="alert-dialog-rtl-sm">عدم السماح</button>
      <button type="submit" value="allow">السماح</button>
    </footer>
  </form>
</dialog>
