<button type="button" class="outline" command="show-modal" commandfor="alert-dialog-basic">Show Dialog</button>

<dialog id="alert-dialog-basic">
  <form method="dialog">
    <header>
      <h3>Are you absolutely sure?</h3>
      <p>This action cannot be undone. This will permanently delete your account and remove your data from our servers.</p>
    </header>
    <footer>
      <button type="button" class="ghost" value="cancel" command="close" commandfor="alert-dialog-basic">Cancel</button>
      <button type="submit" value="continue">Continue</button>
    </footer>
  </form>
</dialog>
