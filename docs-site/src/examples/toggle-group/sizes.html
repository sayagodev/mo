<div class="vstack gap-4 align-left">
  <mo-toggle-group type="single" data-variant="outline">
    <button type="button" class="small" value="top" aria-pressed="true">Top</button>
    <button type="button" class="small" value="bottom" aria-pressed="false">Bottom</button>
    <button type="button" class="small" value="left" aria-pressed="false">Left</button>
    <button type="button" class="small" value="right" aria-pressed="false">Right</button>
  </mo-toggle-group>
  <mo-toggle-group type="single" data-variant="outline">
    <button type="button" value="top" aria-pressed="false">Top</button>
    <button type="button" value="bottom" aria-pressed="true">Bottom</button>
    <button type="button" value="left" aria-pressed="false">Left</button>
    <button type="button" value="right" aria-pressed="false">Right</button>
  </mo-toggle-group>
  <mo-toggle-group type="single" data-variant="outline">
    <button type="button" class="large" value="top" aria-pressed="false">Top</button>
    <button type="button" class="large" value="bottom" aria-pressed="false">Bottom</button>
    <button type="button" class="large" value="left" aria-pressed="false">Left</button>
    <button type="button" class="large" value="right" aria-pressed="true">Right</button>
  </mo-toggle-group>
</div>
