<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mo test</title>
<link rel="stylesheet" href="/dist/mo.min.css" />
<script src="/dist/mo.min.js"></script>
<style>body { padding: 2rem }</style>
</head>
<body>

<div role="alert" data-test="default">
  <h4>Heads up!</h4>
  <p>You can add components with plain HTML.</p>
</div>
<div role="alert" data-test="danger" data-variant="danger">
  <h4>Session expired</h4>
  <p>Please log in again.</p>
</div>
<div role="alert" data-test="icon">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
  <h4>Saved</h4>
  <p>Synced.</p>
</div>

</body>
</html>
